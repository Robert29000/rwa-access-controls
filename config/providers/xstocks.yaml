# xStocks (Backed Finance) tokens on Ethereum.
#
# Each token is a TransparentUpgradeableProxy for BackedAutoFeeTokenImplementation.
# Each role is one address variable with a setter event.
# Source: https://github.com/backed-fi/backed-token-contract

name: xStocks
chain: ethereum                        # Key in config/chains.yaml
framework: single_address_roles

abis:                                  # Short names for ABI files in abis/
  token: backed/BackedAutoFeeTokenImplementation.json
  proxy: backed/BackedTokenProxy.json
  proxy_admin: backed/ProxyAdmin.json

# For each role: the setter event and its address argument (current value = newest event),
# and the on-chain reader that validates the value.
roles:
  - name: owner
    event: {abi: token, name: OwnershipTransferred, arg: newOwner}
    read: {abi: token, function: owner}

  - name: minter
    event: {abi: token, name: NewMinter, arg: newMinter}
    read: {abi: token, function: minter}

  - name: burner
    event: {abi: token, name: NewBurner, arg: newBurner}
    read: {abi: token, function: burner}

  - name: pauser
    event: {abi: token, name: NewPauser, arg: newPauser}
    read: {abi: token, function: pauser}

  - name: multiplierUpdater
    event: {abi: token, name: NewMultiplierUpdater, arg: newMultiplierUpdater}
    read: {abi: token, function: multiplierUpdater}

  # The ProxyAdmin contract. AdminChanged has no indexed arguments: the address is in the data.
  - name: proxyAdmin
    event: {abi: proxy, name: AdminChanged, arg: newAdmin}
    read: {storage_slot: eip1967.admin}

  # Owner of the ProxyAdmin. This address can upgrade the token.
  - name: proxyAdminOwner
    source: proxyAdmin                 # Events and reads go to the proxyAdmin address
    start_block: 0
    event: {abi: proxy_admin, name: OwnershipTransferred, arg: newOwner}
    read: {abi: proxy_admin, function: owner}

# start_block: token creation block. The log scan starts there.
tokens:
