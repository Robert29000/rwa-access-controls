[project]
name = "rwa-access"
version = "0.1.0"
description = "Collect and validate access-control role holders of tokenized stocks."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "eth-hash[pycryptodome]>=0.7",
    "eth-abi>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rwa-access = "rwa_access.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rwa_access*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
